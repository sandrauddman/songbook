<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <!-- Background: Inky Deep Black with subtle dark radial vignette -->
    <linearGradient id="bg-black-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f13"/>
      <stop offset="35%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Metallic Festive Gold Gradient -->
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Dark Ribbon Fold Shadow -->
    <linearGradient id="ribbon-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Glow & Drop Shadows -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>

    <filter id="dock-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background: Pure Dark OLED -->
  <rect width="390" height="844" fill="url(#bg-black-gold)"/>

  <!-- Subtle ambient top warm glow (very discreet, black remains dominant) -->
  <circle cx="195" cy="50" r="180" fill="#f59e0b" opacity="0.04"/>

  <!-- Status Bar (Mobile iOS Style) -->
  <g id="status-bar">
    <text x="36" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">21:42</text>
    <!-- Dynamic Island / Sensor Notch Placeholder -->
    <rect x="135" y="10" width="120" height="28" rx="14" fill="#000000"/>
    <!-- Battery & Signal Icons -->
    <path d="M322 22h3v10h-3zm-6 2h3v8h-3zm-6 3h3v5h-3zm-6 3h3v2h-3z" fill="#ffffff"/>
    <rect x="338" y="21" width="22" height="12" rx="3" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    <rect x="340" y="23" width="15" height="8" rx="1.5" fill="#22c55e"/>
    <path d="M361 25v4" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Header & Navigation Bar -->
  <g id="header-nav" transform="translate(18, 52)">
    <!-- Back Button -->
    <rect x="0" y="4" width="44" height="44" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <path d="M26 18L18 26L26 34" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="7" y="58" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Tillbaka</text>

    <!-- Center: Title & Melody -->
    <g transform="translate(60, 0)">
      <text x="117" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Helan Går</text>
      <!-- Melody Badge with Gold Fill -->
      <g transform="translate(117, 34)" filter="url(#gold-glow)">
        <rect x="-72" y="0" width="144" height="26" rx="13" fill="url(#gold-grad)"/>
        <text x="0" y="17" text-anchor="middle" fill="#451a03" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">🎵 Melodi: Helan går</text>
      </g>
    </g>

    <!-- Right Controls: Favorite & QR -->
    <g transform="translate(262, 4)">
      <!-- Star Favorite Button -->
      <rect x="0" y="0" width="42" height="42" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <path d="M21 11L23.8 17.5H30.5L25 21.8L27.2 28.5L21 24.2L14.8 28.5L17 21.8L11.5 17.5H18.2L21 11Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
      <text x="21" y="54" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Favorit</text>

      <!-- Share QR Button -->
      <rect x="48" y="0" width="42" height="42" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <!-- QR Icon Graphic -->
      <rect x="56" y="8" width="8" height="8" rx="1" fill="#ffffff"/>
      <rect x="58" y="10" width="4" height="4" fill="#18181b"/>
      <rect x="74" y="8" width="8" height="8" rx="1" fill="#ffffff"/>
      <rect x="76" y="10" width="4" height="4" fill="#18181b"/>
      <rect x="56" y="26" width="8" height="8" rx="1" fill="#ffffff"/>
      <rect x="58" y="28" width="4" height="4" fill="#18181b"/>
      <rect x="68" y="20" width="4" height="4" fill="#f59e0b"/>
      <rect x="76" y="22" width="6" height="8" fill="#ffffff"/>
      <rect x="70" y="10" width="3" height="3" fill="#ffffff"/>
      <text x="69" y="54" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Dela QR</text>
    </g>
  </g>

  <!-- Lyric Display Area (Stark OLED White on Inky Black) -->
  <g id="lyrics-canvas" transform="translate(195, 175)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Stanza 1 -->
    <text y="50" fill="#ffffff" font-size="25" font-weight="800">Helan går, sjung hopp</text>
    <text y="88" fill="#ffffff" font-size="25" font-weight="800">faderallan lallan lej!</text>

    <!-- Stanza 2 -->
    <text y="152" fill="#ffffff" font-size="25" font-weight="800">Helan går, sjung hopp</text>
    <text y="190" fill="#ffffff" font-size="25" font-weight="800">faderallan lej!</text>

    <!-- Stanza 3 -->
    <text y="254" fill="#ffffff" font-size="25" font-weight="800">Och den som inte</text>
    <text y="292" fill="#ffffff" font-size="25" font-weight="800">helan tar, han heller</text>
    <text y="330" fill="#ffffff" font-size="25" font-weight="800">inte halvan får...</text>

    <!-- Toast Instruction Note -->
    <text y="380" fill="#a1a1aa" font-size="13" font-weight="500" font-style="italic">✨ Skålas kraftfullt efter sista raden!</text>
  </g>

  <!-- Celebratory Gold Banner "SKÅL! 🍻" -->
  <g id="toast-banner" transform="translate(195, 625)" filter="url(#gold-glow)">
    <!-- Ribbon tails left -->
    <polygon points="-130,-15 -148,0 -130,15 -120,5 -120,-15" fill="url(#ribbon-shadow)"/>
    <!-- Ribbon tails right -->
    <polygon points="130,-15 148,0 130,15 120,5 120,-15" fill="url(#ribbon-shadow)"/>

    <!-- Main Gold Ribbon Body -->
    <rect x="-115" y="-22" width="230" height="44" rx="8" fill="url(#gold-grad)"/>
    <rect x="-112" y="-19" width="224" height="38" rx="6" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Ribbon Text -->
    <text x="0" y="7" text-anchor="middle" fill="#3f1a02" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" letter-spacing="1.5">SKÅL! 🍻</text>
  </g>

  <!-- Sticky Sing-Along Toolbelt (Bottom Floating Dock) -->
  <g id="bottom-toolbelt" transform="translate(16, 742)" filter="url(#dock-shadow)">
    <!-- Dock Container: Charcoal with subtle 1px border -->
    <rect width="358" height="66" rx="20" fill="#141417" stroke="#27272e" stroke-width="1.2"/>

    <!-- Screen Wake Lock Status Pill -->
    <g transform="translate(12, 10)">
      <rect width="144" height="46" rx="14" fill="#241e12" stroke="#453215" stroke-width="1"/>
      <!-- Glowing Bulb Icon -->
      <g transform="translate(12, 10)">
        <circle cx="13" cy="13" r="13" fill="#f59e0b"/>
        <text x="13" y="18" text-anchor="middle" font-size="14">💡</text>
      </g>
      <text x="44" y="20" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Skärmen vaken</text>
      <text x="44" y="34" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="500">Släcks ej under sång</text>
    </g>

    <!-- Font Size Controls: A- / A+ -->
    <g transform="translate(168, 14)">
      <!-- A- Button -->
      <rect x="0" y="0" width="36" height="38" rx="10" fill="#202025" stroke="#2f2f38" stroke-width="1"/>
      <text x="18" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">A-</text>

      <!-- A+ Button -->
      <rect x="42" y="0" width="36" height="38" rx="10" fill="#202025" stroke="#2f2f38" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">A+</text>
    </g>

    <!-- Song Navigation Steppers: < and > -->
    <g transform="translate(258, 14)">
      <!-- Previous Button -->
      <rect x="0" y="0" width="40" height="38" rx="10" fill="#202025" stroke="#2f2f38" stroke-width="1"/>
      <path d="M23 13L16 19L23 25" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Next Button with Gold Highlight -->
      <rect x="46" y="0" width="40" height="38" rx="10" fill="#f59e0b" stroke="#fbbf24" stroke-width="1"/>
      <path d="M63 13L70 19L63 25" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Home Bar Indicator -->
  <rect x="130" y="828" width="130" height="4" rx="2" fill="#3f3f46"/>
</svg>
