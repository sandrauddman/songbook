<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg-grad-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14110f"/>
      <stop offset="50%" stop-color="#1c1612"/>
      <stop offset="100%" stop-color="#0f0c0a"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c221a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a1410" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="gold-grad-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bg-grad-1)"/>

  <!-- Subtle ambient light glow at top -->
  <circle cx="195" cy="40" r="140" fill="#f59e0b" opacity="0.08" filter="url(#glow-1)"/>

  <!-- Status Bar -->
  <text x="32" y="34" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">21:42</text>
  <path d="M340 24h18a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-18a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zm22 3v5" stroke="#fef3c7" stroke-width="1.5" fill="none"/>
  <rect x="342" y="26" width="12" height="7" rx="1" fill="#f59e0b"/>

  <!-- Header -->
  <g transform="translate(20, 52)">
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#2d2015" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="9" y="26" font-size="18">🍻</text>
    <text x="48" y="20" fill="#fbbf24" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold">Skål! Sångbok</text>
    <text x="49" y="34" fill="#a89988" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Festvisor &amp; Snapsar</text>

    <!-- Theme & Admin Buttons -->
    <rect x="290" y="4" width="30" height="30" rx="8" fill="#251c14" stroke="#4a3b2c" stroke-width="1"/>
    <text x="298" y="24" font-size="13">🌙</text>
    <rect x="326" y="4" width="30" height="30" rx="8" fill="#251c14" stroke="#4a3b2c" stroke-width="1"/>
    <text x="334" y="24" font-size="13">⚙️</text>
  </g>

  <!-- Search Bar -->
  <g transform="translate(20, 106)">
    <rect width="350" height="44" rx="12" fill="#231b14" stroke="#d97706" stroke-width="1.2"/>
    <text x="14" y="28" fill="#f59e0b" font-size="15">🔍</text>
    <text x="42" y="27" fill="#8c7a6b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Sök visa, melodi eller sångtext...</text>
  </g>

  <!-- Category Pills (Horizontal Scroll) -->
  <g transform="translate(20, 162)">
