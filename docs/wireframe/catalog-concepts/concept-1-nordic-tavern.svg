    <rect x="0" y="0" width="60" height="32" rx="16" fill="url(#gold-grad-1)"/>
    <text x="18" y="20" fill="#1c1208" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">Alla</text>

