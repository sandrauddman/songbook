    </text>

    <rect x="12" y="122" width="144" height="20" rx="6" fill="#f59e0b" opacity="0.15"/>
    <text x="56" y="136" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">Sjung nu ›</text>
  </g>

