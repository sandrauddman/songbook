  <g transform="translate(202, 404)">
    <rect width="168" height="152" rx="14" fill="url(#card-grad-1)" stroke="#4a3b2c" stroke-width="1"/>
    <rect x="10" y="10" width="62" height="18" rx="9" fill="#3d2915"/>
    <text x="16" y="23" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">🥃 SNAPS</text>

    <circle cx="146" cy="20" r="12" fill="#2a1f18"/>
    <text x="140" y="25" fill="#6b5c4f" font-size="12">☆</text>

    <text x="12" y="52" fill="#fff" font-family="'Playfair Display', serif" font-size="14" font-weight="bold">Mera Brännvin</text>
    <text x="12" y="68" fill="#d97706" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Melodi: Internationalen</text>

    <text x="12" y="90" fill="#a89988" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
      <tspan x="12" dy="0">"Mera brännvin i glasen,</tspan>
      <tspan x="12" dy="14">mera glas på vårt bord!..."</tspan>
