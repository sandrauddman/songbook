    <rect x="12" y="122" width="144" height="20" rx="6" fill="#f59e0b" opacity="0.15"/>
    <text x="56" y="136" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">Sjung nu ›</text>
  </g>

  <!-- Card 5 (Partial scroll preview) -->
  <g transform="translate(20, 570)">
    <rect width="168" height="152" rx="14" fill="url(#card-grad-1)" stroke="#4a3b2c" stroke-width="1"/>
    <rect x="10" y="10" width="76" height="18" rx="9" fill="#1e2c1e"/>
    <text x="16" y="23" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">🌸 SOMMAR</text>
    <text x="12" y="52" fill="#fff" font-family="'Playfair Display', serif" font-size="14" font-weight="bold">Små Grodorna</text>
  </g>
  <g transform="translate(202, 570)">
    <rect width="168" height="152" rx="14" fill="url(#card-grad-1)" stroke="#4a3b2c" stroke-width="1"/>
    <rect x="10" y="10" width="62" height="18" rx="9" fill="#2c1e2c"/>
    <text x="16" y="23" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">☕ PUNSCH</text>
    <text x="12" y="52" fill="#fff" font-family="'Playfair Display', serif" font-size="14" font-weight="bold">Punschen Kommer</text>
  </g>

  <!-- Sticky Bottom Quick Toast Bar -->
