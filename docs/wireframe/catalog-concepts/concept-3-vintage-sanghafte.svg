<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="parchment-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf7ee"/>
      <stop offset="50%" stop-color="#f5eedc"/>
      <stop offset="100%" stop-color="#ece2cc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#parchment-grad)"/>

  <!-- Vintage Outer Double Border -->
  <rect x="12" y="12" width="366" height="820" rx="4" fill="none" stroke="#8c6d46" stroke-width="1.5" opacity="0.6"/>
  <rect x="16" y="16" width="358" height="812" rx="2" fill="none" stroke="#8c6d46" stroke-width="0.8" opacity="0.4"/>

  <!-- Corner Vintage Ornaments -->
  <text x="22" y="32" fill="#8c6d46" font-family="serif" font-size="14">✤</text>
  <text x="356" y="32" fill="#8c6d46" font-family="serif" font-size="14">✤</text>
  <text x="22" y="818" fill="#8c6d46" font-family="serif" font-size="14">✤</text>
  <text x="356" y="818" fill="#8c6d46" font-family="serif" font-size="14">✤</text>

  <!-- Header Banner -->
  <g transform="translate(195, 64)" text-anchor="middle">
    <text y="0" fill="#4a3520" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" letter-spacing="3">SÅNGHÄFTE</text>
    <text y="18" fill="#7a5c3e" font-family="Georgia, serif" font-style="italic" font-size="12">För glada bordsvänners lag</text>
    
    <!-- Decorative Center Divider -->
    <path d="M-90 28 Q 0 36 90 28" stroke="#8c6d46" stroke-width="1" fill="none"/>
    <circle cx="0" cy="32" r="3" fill="#8c6d46"/>
  </g>

  <!-- Vintage Search Box -->
  <g transform="translate(32, 116)">
    <rect width="326" height="40" rx="4" fill="#fffdfa" stroke="#a3855e" stroke-width="1"/>
    <text x="12" y="25" fill="#7a5c3e" font-family="Georgia, serif" font-style="italic" font-size="13">Sök bland häftets visor...</text>
    <text x="300" y="25" fill="#8c6d46" font-size="13">🔍</text>
  </g>

  <!-- Category Ribbons -->
  <g transform="translate(32, 168)">
    <rect x="0" y="0" width="76" height="26" rx="3" fill="#4a3520"/>
    <text x="12" y="17" fill="#fcf9f2" font-family="Georgia, serif" font-size="11" font-weight="bold">Alla visor</text>

    <rect x="82" y="0" width="76" height="26" rx="3" fill="#dfd3be" stroke="#a3855e" stroke-width="0.8"/>
    <text x="94" y="17" fill="#4a3520" font-family="Georgia, serif" font-size="11">Snapsar</text>

    <rect x="164" y="0" width="80" height="26" rx="3" fill="#dfd3be" stroke="#a3855e" stroke-width="0.8"/>
    <text x="176" y="17" fill="#4a3520" font-family="Georgia, serif" font-size="11">Kräftskiva</text>

    <rect x="250" y="0" width="76" height="26" rx="3" fill="#dfd3be" stroke="#a3855e" stroke-width="0.8"/>
    <text x="264" y="17" fill="#4a3520" font-family="Georgia, serif" font-size="11">Favoriter</text>
  </g>

  <!-- Vintage Booklet Song List -->
  <g transform="translate(32, 214)">

    <!-- Entry 1: Helan Går -->
    <g transform="translate(0, 0)">
      <rect width="326" height="96" rx="4" fill="#fdfbf7" stroke="#cbba9e" stroke-width="0.8"/>
      <text x="14" y="26" fill="#382512" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="bold">N:o 1. Helan Går</text>
      <text x="14" y="44" fill="#8c6d46" font-family="Georgia, serif" font-style="italic" font-size="12">Melodi: Egen melodi</text>
      
      <text x="14" y="64" fill="#594430" font-family="Georgia, serif" font-size="11">
        <tspan x="14" dy="0">"Helan går, sjung hopp faderallan lallan lej!</tspan>
        <tspan x="14" dy="15">Helan går, sjung hopp faderallan lej!..."</tspan>
      </text>

      <text x="296" y="28" fill="#b45309" font-size="15">★</text>
      <text x="292" y="74" fill="#8c6d46" font-family="Georgia, serif" font-size="16">❦</text>
    </g>

    <!-- Entry 2: Halvan -->
    <g transform="translate(0, 106)">
      <rect width="326" height="96" rx="4" fill="#fdfbf7" stroke="#cbba9e" stroke-width="0.8"/>
      <text x="14" y="26" fill="#382512" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="bold">N:o 2. Halvan</text>
      <text x="14" y="44" fill="#8c6d46" font-family="Georgia, serif" font-style="italic" font-size="12">Melodi: Hurra vad jag är glad</text>
      
      <text x="14" y="64" fill="#594430" font-family="Georgia, serif" font-size="11">
        <tspan x="14" dy="0">"Hur länge skall på bordet den lilla halvan stå?</tspan>
        <tspan x="14" dy="15">Skall den ej snart i magen få lov att gå?..."</tspan>
      </text>

      <text x="296" y="28" fill="#a89988" font-size="15">☆</text>
      <text x="292" y="74" fill="#8c6d46" font-family="Georgia, serif" font-size="16">❦</text>
    </g>

    <!-- Entry 3: Tersen -->
    <g transform="translate(0, 212)">
      <rect width="326" height="96" rx="4" fill="#fdfbf7" stroke="#cbba9e" stroke-width="0.8"/>
      <text x="14" y="26" fill="#382512" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="bold">N:o 3. Tersen</text>
      <text x="14" y="44" fill="#8c6d46" font-family="Georgia, serif" font-style="italic" font-size="12">Melodi: Fritiof och Carmencita</text>
      
      <text x="14" y="64" fill="#594430" font-family="Georgia, serif" font-size="11">
        <tspan x="14" dy="0">"Nu tar vi tersen, den gör susen i vår kropp,</tspan>
        <tspan x="14" dy="15">så lyft nu glaset uti en munter topp!..."</tspan>
      </text>

      <text x="296" y="28" fill="#b45309" font-size="15">★</text>
      <text x="292" y="74" fill="#8c6d46" font-family="Georgia, serif" font-size="16">❦</text>
    </g>

    <!-- Entry 4: Kräftans Lov -->
    <g transform="translate(0, 318)">
      <rect width="326" height="96" rx="4" fill="#fdfbf7" stroke="#cbba9e" stroke-width="0.8"/>
      <text x="14" y="26" fill="#382512" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="bold">N:o 4. Kräftans Lov</text>
      <text x="14" y="44" fill="#8c6d46" font-family="Georgia, serif" font-style="italic" font-size="12">Melodi: Mors lilla Olle</text>
      
      <text x="14" y="64" fill="#594430" font-family="Georgia, serif" font-size="11">
        <tspan x="14" dy="0">"Kräftorna skramla i grytan så röd,</tspan>
        <tspan x="14" dy="15">och dillen den doftar och kronan ger glöd..."</tspan>
      </text>

      <text x="296" y="28" fill="#a89988" font-size="15">☆</text>
      <text x="292" y="74" fill="#8c6d46" font-family="Georgia, serif" font-size="16">❦</text>
    </g>

    <!-- Entry 5: Punschen Kommer -->
    <g transform="translate(0, 424)">
      <rect width="326" height="88" rx="4" fill="#fdfbf7" stroke="#cbba9e" stroke-width="0.8"/>
      <text x="14" y="26" fill="#382512" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="bold">N:o 5. Punschen Kommer</text>
      <text x="14" y="44" fill="#8c6d46" font-family="Georgia, serif" font-style="italic" font-size="12">Melodi: Vals ur Glada Änkan</text>
    </g>
  </g>

  <!-- Vintage Footer Page Number -->
  <g transform="translate(195, 785)" text-anchor="middle">
    <text y="0" fill="#7a5c3e" font-family="Georgia, serif" font-style="italic" font-size="12">— Sida 1 av 6 —</text>
  </g>
</svg>
