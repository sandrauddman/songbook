      <text x="10" y="68" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Hurra vad jag är glad</text>
      
      <text x="10" y="90" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">
        <tspan x="10" dy="0">"Hur länge skall på</tspan>
        <tspan x="10" dy="12">bordet den lilla..."</tspan>
      </text>

      <rect x="10" y="118" width="124" height="22" rx="6" fill="#374151"/>
      <text x="44" y="133" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Öppna visa</text>
