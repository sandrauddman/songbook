      <rect x="10" y="10" width="46" height="18" rx="9" fill="#3b291a"/>
      <text x="16" y="23" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">Nr 3</text>
      <text x="122" y="24" fill="#4b5563" font-size="12">☆</text>
      
      <text x="10" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">Mera Brännvin</text>
      <text x="10" y="68" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Internationalen</text>
      
      <text x="10" y="90" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">
        <tspan x="10" dy="0">"Mera brännvin i</tspan>
        <tspan x="10" dy="12">glasen, mera glas..."</tspan>
      </text>

      <rect x="10" y="118" width="124" height="22" rx="6" fill="#374151"/>
      <text x="44" y="133" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Öppna visa</text>
    </g>

