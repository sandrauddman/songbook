  <!-- Section 2 Header: "Kräftskiva & Högtid" -->
  <g transform="translate(20, 480)">
    <text x="0" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">🦞 Kräftskiva &amp; Högtid</text>
    <text x="350" y="14" text-anchor="end" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Visa alla (6) ›</text>
  </g>

  <!-- Carousel Row 2 -->
  <g transform="translate(20, 504)">
    
    <!-- Carousel Card 2.1: Kräftans Lov -->
    <g transform="translate(0, 0)">
      <rect width="144" height="150" rx="14" fill="url(#card-grad-5)" stroke="#374151" stroke-width="1"/>
      <rect x="10" y="10" width="56" height="18" rx="9" fill="#381d18"/>
      <text x="16" y="23" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">Kräfta</text>
      <text x="122" y="24" fill="#f59e0b" font-size="12">★</text>
      
      <text x="10" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">Kräftans Lov</text>
      <text x="10" y="68" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Mors lilla Olle</text>
      
      <text x="10" y="90" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">
        <tspan x="10" dy="0">"Kräftorna skramlar</tspan>
        <tspan x="10" dy="12">i grytan så röd..."</tspan>
      </text>

      <rect x="10" y="118" width="124" height="22" rx="6" fill="#374151"/>
      <text x="44" y="133" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Öppna visa</text>
    </g>

    <!-- Carousel Card 2.2: En Kräfta -->
    <g transform="translate(156, 0)">
      <rect width="144" height="150" rx="14" fill="url(#card-grad-5)" stroke="#374151" stroke-width="1"/>
      <rect x="10" y="10" width="56" height="18" rx="9" fill="#381d18"/>
      <text x="16" y="23" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">Kräfta</text>
      <text x="122" y="24" fill="#4b5563" font-size="12">☆</text>
      
      <text x="10" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">Kräftans Visa</text>
      <text x="10" y="68" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Tre små gummor</text>
      
      <text x="10" y="90" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">
        <tspan x="10" dy="0">"En kräfta vi ska äta,</tspan>
        <tspan x="10" dy="12">en nubbe vi ska ta..."</tspan>
      </text>

      <rect x="10" y="118" width="124" height="22" rx="6" fill="#374151"/>
      <text x="44" y="133" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Öppna visa</text>
    </g>

