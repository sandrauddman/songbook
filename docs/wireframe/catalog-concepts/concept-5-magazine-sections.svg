  <!-- Sticky Bottom Navigation -->
  <g transform="translate(0, 756)">
    <rect width="390" height="88" fill="#080c14" opacity="0.96" stroke="#1e293b" stroke-width="1"/>
    <rect x="20" y="12" width="350" height="48" rx="24" fill="#f59e0b"/>
    <text x="136" y="42" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">🎲 Slumpa en Visa!</text>
  </g>
