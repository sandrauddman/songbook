<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="hero-grad-5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="card-grad-5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#0c1017"/>

  <!-- Status Bar -->
  <text x="32" y="34" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">21:42</text>
  <path d="M340 24h18a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-18a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zm22 3v5" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <rect x="342" y="26" width="14" height="7" rx="1" fill="#f59e0b"/>

  <!-- Top App Bar -->
  <g transform="translate(20, 52)">
    <text x="0" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800">Sångboken</text>
    <text x="0" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Upptäck &amp; sjung tillsammans</text>

    <circle cx="316" cy="18" r="16" fill="#1e293b"/>
    <text x="309" y="24" font-size="14">🔍</text>
    <circle cx="354" cy="18" r="16" fill="#1e293b"/>
    <text x="347" y="24" font-size="14">⚙️</text>
  </g>

  <!-- Featured Hero Banner: "Kvällens Första Snaps" -->
  <g transform="translate(20, 106)">
    <rect width="350" height="150" rx="18" fill="url(#hero-grad-5)" stroke="#f59e0b" stroke-width="1.2"/>
    
    <rect x="16" y="16" width="128" height="20" rx="10" fill="#fef3c7" opacity="0.2"/>
    <text x="24" y="30" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">🌟 KVÄLLENS FÖRSTA</text>

    <text x="16" y="66" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold">Helan Går</text>
    <text x="16" y="86" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Melodi: Helan går • Klassiker</text>

    <text x="16" y="112" fill="#fef3c7" opacity="0.8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      "Helan går, sjung hopp faderallan lallan lej..."
    </text>

    <!-- Hero CTA Button -->
    <rect x="236" y="98" width="100" height="36" rx="18" fill="#fbbf24"/>
    <text x="254" y="121" fill="#451a03" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">Sjung Nu 🍻</text>
  </g>

  <!-- Section 1 Header: "Populära Snapsvisor" -->
  <g transform="translate(20, 280)">
    <text x="0" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">🥃 Populära Snapsvisor</text>
