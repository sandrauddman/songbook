      <rect width="144" height="150" rx="14" fill="url(#card-grad-5)" stroke="#374151" stroke-width="1"/>
      <rect x="10" y="10" width="46" height="18" rx="9" fill="#3b291a"/>
      <text x="16" y="23" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">Nr 2</text>
