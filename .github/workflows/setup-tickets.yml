name: Setup Project Issues & Milestones

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Ticket Setup Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/setup-github-issues.mjs
